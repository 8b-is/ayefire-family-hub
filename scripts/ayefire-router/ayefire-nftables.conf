#!/usr/sbin/nft -f
# AyeFire Sovereign Multi-VLAN Edge Gateway — Stateful nftables Firewall & NAT Ruleset
# Host: 8bsov (WAN = eno2 Intel I226-V 2.5G w/ ISP MAC clone, LAN trunk = eno1 Aquantia 10G)
#
# Security & Sovereignty Invariants (ayefire_onboard.rs Tier 1):
#   1. Default-drop all unsolicited WAN ingress on eno2.
#   2. Camera VLANs (`eno1.255` watchit, `eno1.128` camz) & dynamic `iot_local_only` set are
#      strictly LOCAL-ONLY: full LAN/NVR access, ZERO WAN egress!
#   3. Steer LAN UDP/TCP port 53 across ALL VLANs -> AyeFire Sovereign DNS (:5354) so `.aye`,
#      caching DNS, telemetry sinkhole, and automatic air-gap failover protect every device.
#   4. TCP MSS clamping on WAN forwarding + full wg-i1 mesh passthrough.

define WAN_IF = "eno2"
define LAN_IFS = { "eno1", "eno1.1", "eno1.9", "eno1.43", "eno1.61", "eno1.101", "eno1.128", "eno1.255", "eno1.363" }
define CAM_LOCAL_ONLY_IFS = { "eno1.128", "eno1.255" }
define WG_IF  = "wg-i1"
define AYEFIRE_DNS_PORT = 5354

table inet ayefire_gateway
delete table inet ayefire_gateway

table inet ayefire_gateway {
    # Add individual IoT / Smart TV / camera IPs dynamically:
    #   sudo nft add element inet ayefire_gateway iot_local_only { 172.16.47.55 }
    set iot_local_only {
        type ipv4_addr
        flags interval
        comment "Local-only IoT/cameras: full LAN access, zero WAN egress"
    }

    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # ICMP / ICMPv6 diagnostics & path MTU discovery
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 20/second accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

        # Allow ISP DHCPv4 / DHCPv6 replies on WAN
        iifname $WAN_IF udp sport 67 udp dport 68 accept
        iifname $WAN_IF udp sport 547 udp dport 546 accept

        # Allow all local LAN VLANs & i1 WireGuard mesh to AyeFire services (DNS, HTTP :8790, Cache Proxy :8792, IPP :6631, DHCP, SSH)
        iifname $LAN_IFS accept
        iifname $WG_IF accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # MSS clamping to PMTU for clean WAN & WireGuard frames
        oifname $WAN_IF tcp flags syn tcp option maxseg size set rt mtu

        ct state established,related accept
        ct state invalid drop

        # Tier 1 Sovereignty: Camera VLANs (`watchit`, `camz`) & `iot_local_only` devices NEVER egress to WAN
        iifname $CAM_LOCAL_ONLY_IFS oifname $WAN_IF counter drop
        iifname $LAN_IFS oifname $WAN_IF ip saddr @iot_local_only counter drop

        # Allow non-camera LAN VLANs -> WAN internet
        iifname $LAN_IFS oifname $WAN_IF accept

        # Allow inter-VLAN LAN routing & wg-i1 mesh (cameras can reach local NVR on LAN, never WAN)
        iifname $LAN_IFS oifname $LAN_IFS accept
        iifname $LAN_IFS oifname $WG_IF accept
        iifname $WG_IF   oifname $LAN_IFS accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }

    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;

        # Transparently steer DNS port 53 from ALL LAN VLANs -> AyeFire Sovereign DNS (:5354)
        iifname $LAN_IFS udp dport 53 redirect to :$AYEFIRE_DNS_PORT
        iifname $LAN_IFS tcp dport 53 redirect to :$AYEFIRE_DNS_PORT
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # NAT Masquerade all forwarded LAN VLAN traffic exiting ISP WAN (eno2)
        oifname $WAN_IF counter masquerade
    }
}

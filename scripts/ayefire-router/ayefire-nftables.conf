#!/usr/sbin/nft -f
# AyeFire Sovereign Edge Gateway — Stateful nftables Firewall & NAT Ruleset
# Target host: 8bsov (WAN = eno2 Intel I226-V 2.5G, LAN = eno1 Aquantia 10G, Mesh = wg-i1)
#
# Security & Sovereignty Invariants (ayefire_onboard.rs Tier 1):
#   1. Default-drop all unsolicited WAN ingress on eno2.
#   2. IoT / Camera local-only set (`iot_local_only`): blocked from WAN egress by default
#      while keeping full LAN access (no cloud exfiltration, no OS Root CA needed!).
#   3. Redirect LAN UDP/TCP DNS port 53 -> AyeFire Sovereign DNS (:5354) so `.aye`,
#      caching DNS, telemetry sinkhole, and automatic air-gap failover work for every device.
#   4. Clean TCP MSS clamping on WAN forwarding + full wg-i1 mesh passthrough.

define WAN_IF = "eno2"
define LAN_IF = "eno1"
define WG_IF  = "wg-i1"
define LAN_NET = 172.16.47.0/25
define AYEFIRE_DNS_PORT = 5354

table inet ayefire_gateway
delete table inet ayefire_gateway

table inet ayefire_gateway {
    # Add camera / Smart TV / IoT IPs here (`nft add element inet ayefire_gateway iot_local_only { 172.16.47.55 }`)
    set iot_local_only {
        type ipv4_addr
        flags interval
        comment "Local-only IoT/cameras: full LAN access, zero WAN egress"
    }

    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # Allow ICMP/ICMPv6 diagnostics & path MTU discovery
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 20/second accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

        # Allow DHCPv4 / DHCPv6 replies on WAN
        iifname $WAN_IF udp sport 67 udp dport 68 accept
        iifname $WAN_IF udp sport 547 udp dport 546 accept

        # Allow full trusted LAN & i1 WireGuard mesh into AyeFire services (DNS, HTTP :8790, Proxy :8792, IPP :6631, Phoenix :8080, SSH)
        iifname { $LAN_IF, $WG_IF } accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # MSS clamping to PMTU so PPPoE/tunnel/WAN frames never stall
        oifname $WAN_IF tcp flags syn tcp option maxseg size set rt mtu

        ct state established,related accept
        ct state invalid drop

        # Tier 1 Sovereignty: IoT local-only devices may NEVER egress to WAN
        iifname $LAN_IF oifname $WAN_IF ip saddr @iot_local_only counter drop

        # Allow LAN -> WAN internet and LAN <-> wg-i1 sovereign mesh
        iifname $LAN_IF oifname { $WAN_IF, $WG_IF } accept
        iifname $WG_IF  oifname $LAN_IF accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }

    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;

        # Transparently steer all LAN DNS (port 53) to AyeFire Sovereign DNS (:5354)
        # (prevents hardcoded 8.8.8.8 IoT leaks while giving every device instant `.aye` + cache + sinkhole!)
        iifname $LAN_IF udp dport 53 redirect to :$AYEFIRE_DNS_PORT
        iifname $LAN_IF tcp dport 53 redirect to :$AYEFIRE_DNS_PORT
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # NAT Masquerade LAN -> ISP WAN (eno2)
        oifname $WAN_IF ip saddr $LAN_NET masquerade
    }
}

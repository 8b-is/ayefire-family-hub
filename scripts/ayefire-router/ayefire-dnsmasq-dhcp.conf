# AyeFire Sovereign DHCPv4 Server — Template (Multi-VLAN capable)
#
# Note: `port=0` disables dnsmasq's built-in DNS so AyeFire's pure-Rust Sovereign DNS
# (`ayefire-family-hub` on :5354, redirected from :53 via nftables) handles ALL DNS.
#
# Site-specific VLAN ranges, static MAC reservations, and local domain options are loaded
# from `~/.config/ayefire/dhcp-site.conf` (mode 0600, untracked) when present, or fall back
# to the clean default LAN pool below.

port=0
bind-dynamic
domain-needed
bogus-priv
dhcp-authoritative
dhcp-leasefile=/var/lib/ayefire/dhcp.leases
log-dhcp

# Default single-LAN fallback (overridden automatically when site dhcp-site.conf is provided)
interface=eno1
domain=aye
dhcp-range=172.16.47.70,172.16.47.126,255.255.255.128,24h
dhcp-option=option:router,172.16.47.67
dhcp-option=option:dns-server,172.16.47.67
dhcp-option=252,"http://172.16.47.67:8790/wpad.dat"

# AyeFire Sovereign DHCPv4 Server (Retiring UniFi Dream Machine cleanly)
# Drop-in replacement for UDM on 172.16.47.0/25 — preserves Hue's EXACT LAN subnet
# and gateway IP (172.16.47.67) so existing APs, switches, static hosts (`s` .91,
# `ayekvm` .103, `8bsov` .118) keep working with ZERO renumbering!
#
# Note: `port=0` disables dnsmasq's own DNS so AyeFire's pure-Rust Sovereign DNS
# (`ayefire-family-hub` on :5354, redirected from :53 via nftables) handles ALL DNS.

port=0
interface=eno1
bind-interfaces
domain-needed
bogus-priv

# Local domain & DHCP pool (avoids Hue's static devices .67, .91, .103, .118)
domain=aye
dhcp-authoritative
dhcp-range=172.16.47.10,172.16.47.60,255.255.255.128,12h

# Option 3: Default Gateway = AyeFire on eno1 (exact IP the UDM previously held!)
dhcp-option=option:router,172.16.47.67
# Option 6: DNS Server = AyeFire Sovereign DNS (cached + .aye + telemetry sinkhole)
dhcp-option=option:dns-server,172.16.47.67
# Option 15: Search Domain
dhcp-option=option:domain-name,aye
# Option 119: Domain Search List
dhcp-option=option:domain-search,aye,local
# Option 252: Optional WPAD Proxy Hint (LAN Pull-Through Edge Cache on :8792)
dhcp-option=252,"http://172.16.47.67:8790/wpad.dat"

dhcp-leasefile=/var/lib/ayefire/dhcp.leases
log-dhcp
